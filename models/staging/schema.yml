version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: user_id
        tests:
          - not_null

      - name: eval_set
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['prior', 'train', 'test']

      - name: order_number
        tests:
          - not_null

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

      - name: product_name
        tests:
          - not_null

      - name: aisle_id
        tests:
          - not_null

      - name: department_id
        tests:
          - not_null

  - name: stg_aisles
    columns:
      - name: aisle_id
        tests:
          - not_null
          - unique

      - name: aisle
        tests:
          - not_null

  - name: stg_departments
    columns:
      - name: department_id
        tests:
          - not_null
          - unique

      - name: department
        tests:
          - not_null

  - name: stg_order_products_prior
    columns:
      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: add_to_cart_order
        tests:
          - not_null

      - name: reordered
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: stg_order_products_train
    columns:
      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: add_to_cart_order
        tests:
          - not_null

      - name: reordered
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false